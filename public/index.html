<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatApp</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<!-- ══════════════ AUTH SCREEN ══════════════ -->
<div id="auth-screen" class="screen active">
  <div class="auth-box">
    <div class="logo">💬 ChatApp</div>
    <p class="auth-sub">Общайся, добавляй друзей</p>

    <div class="tabs">
      <button class="tab active" data-tab="login">Войти</button>
      <button class="tab" data-tab="register">Регистрация</button>
    </div>

    <!-- Вход -->
    <div id="tab-login" class="tab-content active">
      <input type="text" id="login-id" placeholder="Твой ID (например: cool_user)" maxlength="32"/>
      <button id="btn-login" class="btn-primary">Войти</button>
    </div>

    <!-- Регистрация -->
    <div id="tab-register" class="tab-content">
      <input type="text" id="reg-id" placeholder="Придумай ID (a-z, 0-9, _)" maxlength="32"/>
      <input type="text" id="reg-nick" placeholder="Никнейм (необязательно)" maxlength="32"/>
      <button id="btn-register" class="btn-primary">Зарегистрироваться</button>
    </div>

    <div id="auth-error" class="error-msg"></div>
  </div>
</div>

<!-- ══════════════ MAIN APP ══════════════ -->
<div id="app-screen" class="screen">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="my-avatar" id="my-avatar">?</div>
      <div class="my-info">
        <div class="my-nick" id="my-nick">—</div>
        <div class="my-id" id="my-id">—</div>
      </div>
      <button id="btn-logout" class="icon-btn" title="Выйти">⏻</button>
    </div>

    <!-- Поиск -->
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="🔍 Найти по ID или нику"/>
      <div id="search-results" class="search-dropdown"></div>
    </div>

    <!-- Запросы в друзья -->
    <div id="requests-section" class="sidebar-section" style="display:none">
      <div class="section-label">Запросы <span id="req-badge" class="badge"></span></div>
      <div id="requests-list"></div>
    </div>

    <!-- Список друзей -->
    <div class="sidebar-section">
      <div class="section-label">Друзья</div>
      <div id="friends-list" class="friends-list">
        <div class="empty-hint">Пока нет друзей 🙁<br>Найди кого-нибудь выше!</div>
      </div>
    </div>
  </aside>

  <!-- Chat area -->
  <main class="chat-area">
    <!-- Placeholder -->
    <div id="chat-placeholder" class="chat-placeholder">
      <div class="ph-icon">💬</div>
      <div class="ph-text">Выбери друга, чтобы начать чат</div>
    </div>

    <!-- Active chat -->
    <div id="chat-window" style="display:none; height:100%; display:none; flex-direction:column">
      <div class="chat-header">
        <div class="chat-friend-avatar" id="chat-avatar">?</div>
        <div class="chat-friend-info">
          <div class="chat-friend-nick" id="chat-nick">—</div>
          <div class="chat-friend-status" id="chat-status">офлайн</div>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="input-bar">
        <input type="text" id="msg-input" placeholder="Написать сообщение…" maxlength="1000"/>
        <button id="btn-send" class="btn-send">➤</button>
      </div>
    </div>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen" class="screen active">
  <div class="auth-bg">
    <div class="auth-blob b1"></div>
    <div class="auth-blob b2"></div>
  </div>
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-logo-icon">💬</div>
      <div class="auth-logo-text">ChatApp</div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="login">Войти</button>
      <button class="tab" data-tab="register">Регистрация</button>
    </div>

    <div id="tab-login" class="tab-content active">
      <div class="field">
        <label>Ваш ID</label>
        <input type="text" id="login-id" placeholder="cool_user123" maxlength="32" autocomplete="username"/>
      </div>
      <div class="field">
        <label>Пароль</label>
        <div class="pw-wrap">
          <input type="password" id="login-pw" placeholder="••••••••" maxlength="64" autocomplete="current-password"/>
          <button class="pw-toggle" data-target="login-pw">👁</button>
        </div>
      </div>
      <button id="btn-login" class="btn-primary">Войти</button>
    </div>

    <div id="tab-register" class="tab-content">
      <div class="field">
        <label>Придумай ID <span class="hint">a-z, 0-9, _</span></label>
        <input type="text" id="reg-id" placeholder="my_cool_id" maxlength="32" autocomplete="username"/>
      </div>
      <div class="field">
        <label>Никнейм <span class="hint">необязательно</span></label>
        <input type="text" id="reg-nick" placeholder="Как тебя зовут?" maxlength="32"/>
      </div>
      <div class="field">
        <label>Пароль <span class="hint">мин. 4 символа</span></label>
        <div class="pw-wrap">
          <input type="password" id="reg-pw" placeholder="••••••••" maxlength="64" autocomplete="new-password"/>
          <button class="pw-toggle" data-target="reg-pw">👁</button>
        </div>
      </div>
      <button id="btn-register" class="btn-primary">Зарегистрироваться</button>
    </div>

    <div id="auth-error" class="error-msg"></div>
  </div>
</div>

<!-- APP -->
<div id="app-screen" class="screen">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="me-card">
        <div class="me-avatar" id="my-avatar">?</div>
        <div class="me-info">
          <div class="me-nick" id="my-nick">—</div>
          <div class="me-id" id="my-id">—</div>
        </div>
        <button id="btn-logout" class="logout-btn" title="Выйти">⏻</button>
      </div>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Найти по ID или нику"/>
        <div id="search-results" class="search-drop"></div>
      </div>
    </div>

    <div class="sidebar-body">
      <div id="requests-section" style="display:none">
        <div class="list-label">Запросы <span id="req-badge" class="badge"></span></div>
        <div id="requests-list"></div>
      </div>

      <div class="list-label">Друзья</div>
      <div id="friends-list">
        <div class="empty-state">
          <div class="empty-icon">👥</div>
          <div>Пока нет друзей</div>
          <div class="empty-sub">Найди кого-нибудь через поиск</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="chat-main">
    <div id="chat-placeholder" class="chat-empty">
      <div class="chat-empty-icon">💬</div>
      <div class="chat-empty-title">Выбери друга</div>
      <div class="chat-empty-sub">чтобы начать общение</div>
    </div>

    <div id="chat-window" class="chat-window" style="display:none">
      <div class="chat-head">
        <div class="chat-head-avatar" id="chat-avatar">?</div>
        <div>
          <div class="chat-head-nick" id="chat-nick">—</div>
          <div class="chat-head-status" id="chat-status">офлайн</div>
        </div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="msg-bar">
        <input type="text" id="msg-input" placeholder="Написать сообщение…" maxlength="1000"/>
        <button id="btn-send" class="send-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M22 2L11 13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
